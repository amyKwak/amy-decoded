<!doctype html>
<html>
<head><meta charset="utf-8"><title>DiceRoll</title>
<style>html,body{margin:0;background:var(--oak-900);} .wrap{max-width:var(--screen-max);padding:var(--space-4);box-sizing:border-box;display:flex;flex-direction:column;gap:var(--space-3);font-family:var(--font-ui);color:var(--cream);}</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
var T = window.LuckyGoose, h = React.createElement;
var Demo = function () {
  return h(React.Fragment, null,
    h(T.DiceRoll, { rolling: true }),
    h(T.DiceRoll, { value: 14, modifier: 3, dc: 12 }),
    h(T.DiceRoll, { value: 20, modifier: 3, dc: 18 }),
    h(T.DiceRoll, { value: 1, modifier: 3, dc: 8 }));
};
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
