<!-- @dsCard group="Quest board" height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>QuestCard</title>
<style>html,body{margin:0;background:var(--oak-900);} .wrap{max-width:var(--screen-max);padding:var(--space-4);box-sizing:border-box;display:flex;flex-direction:column;gap:var(--space-3);font-family:var(--font-ui);color:var(--cream);}</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
var T = window.LuckyGoose, h = React.createElement;
var Demo = function () {
  var s = React.useState(1);
  var q = [['Steal the moon','Someone has to. Might as well be you.'],['Win the wizard bake-off','Sabotage optional. Frosting mandatory.'],["Find the king's lost sock","Last seen near the royal laundry."]];
  return h(React.Fragment, null, q.map(function (x, i) { return h(T.QuestCard, { key: i, title: x[0], hint: x[1], selected: s[0] === i, onClick: function () { s[1](i); } }); }));
};
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
