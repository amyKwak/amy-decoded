<!doctype html>
<html>
<head><meta charset="utf-8"><title>EndScreen</title>
<style>html,body{margin:0;background:var(--oak-900);} .wrap{max-width:var(--screen-max);padding:var(--space-4);box-sizing:border-box;display:flex;flex-direction:column;gap:var(--space-3);font-family:var(--font-ui);color:var(--cream);}</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
var T = window.LuckyGoose, h = React.createElement;
var Demo = function () {
  return h(React.Fragment, null,
    h(T.EndScreen, { outcome: 'victory' }, 'Mira charmed the judges, Grub kneaded the dough into submission, and Pip swapped exactly one label. The pie won. Nobody asks about the salt.'),
    h(T.EndScreen, { outcome: 'defeat' }, 'The pastry golem was, in the end, too powerful. Grub is napping in a flour sack. Mira is still humming.'));
};
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
