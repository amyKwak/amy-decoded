<!doctype html>
<html>
<head><meta charset="utf-8"><title>HeroSlot</title>
<style>html,body{margin:0;background:var(--oak-900);} .wrap{max-width:var(--screen-max);padding:var(--space-4);box-sizing:border-box;display:flex;flex-direction:column;gap:var(--space-3);font-family:var(--font-ui);color:var(--cream);}</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
var T = window.LuckyGoose, h = React.createElement;
var Demo = function () {
  return h(React.Fragment, null,
    h(T.HeroSlot, { name: 'Mira', heroClass: 'jester', onRemove: function () {} }),
    h(T.HeroSlot, { name: 'Grub', heroClass: 'knight', onRemove: function () {} }),
    h(T.HeroSlot, { name: 'Pip', heroClass: 'thief', onRemove: function () {} }),
    h(T.HeroSlot, { onAdd: function () {}, addLabel: '+ Add a hero (3 of 4)' }));
};
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
