<!doctype html>
<html>
<head><meta charset="utf-8"><title>StoryLine</title>
<style>html,body{margin:0;background:var(--oak-900);} .wrap{max-width:var(--screen-max);padding:var(--space-4);box-sizing:border-box;display:flex;flex-direction:column;gap:var(--space-3);font-family:var(--font-ui);color:var(--cream);}</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
var T = window.LuckyGoose, h = React.createElement;
var Demo = function () {
  return h(React.Fragment, null,
    h(T.StoryLine, { state: 'read' }, 'The Lucky Goose is unusually quiet tonight.'),
    h(T.StoryLine, { state: 'earlier', reader: { name: 'Grub', heroClass: 'warrior' } }, 'A note slides under the door. It smells of cinnamon and bad decisions.'),
    h(T.StoryLine, { state: 'current', reader: { name: 'Mira', heroClass: 'bard' }, streaming: true }, 'It says: "The wizard bake-off starts at moonrise. Bring a whisk.'));
};
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
