<!doctype html>
<html>
<head><meta charset="utf-8"><title>PartyBar</title>
<style>html,body{margin:0;background:var(--oak-900);} .wrap{max-width:var(--screen-max);padding:var(--space-4);box-sizing:border-box;display:flex;flex-direction:column;gap:var(--space-3);font-family:var(--font-ui);color:var(--cream);}</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
var T = window.LuckyGoose, h = React.createElement;
var Demo = function () {
  return h(T.PartyBar, { heroes: [
    { name: 'Mira', heroClass: 'jester', hp: 8, active: true },
    { name: 'Grub', heroClass: 'knight', hp: 3 },
    { name: 'Pip', heroClass: 'thief', hp: 10 },
    { name: 'Zed', heroClass: 'wizard', hp: 0 }
  ] });
};
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
