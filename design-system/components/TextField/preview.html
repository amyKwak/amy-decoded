<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField</title>
<style>html,body{margin:0;background:var(--oak-900);} .wrap{max-width:var(--screen-max);padding:var(--space-4);box-sizing:border-box;display:flex;flex-direction:column;gap:var(--space-3);font-family:var(--font-ui);color:var(--cream);}</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
var T = window.LuckyGoose, h = React.createElement;
var Demo = function () {
  return h(React.Fragment, null,
    h(T.TextField, { label: "What's your hero called?", placeholder: 'Mira the Loud' }),
    h(T.TextField, { label: 'Or dream up your own quest', placeholder: 'Teach a dragon to knit', multiline: true, hint: 'Anything goes. The game master will make it work.' }));
};
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
