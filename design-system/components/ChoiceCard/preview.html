<!doctype html>
<html>
<head><meta charset="utf-8"><title>ChoiceCard</title>
<style>html,body{margin:0;background:var(--oak-900);} .wrap{max-width:var(--screen-max);padding:var(--space-4);box-sizing:border-box;display:flex;flex-direction:column;gap:var(--space-3);font-family:var(--font-ui);color:var(--cream);}</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
var T = window.LuckyGoose, h = React.createElement;
var Demo = function () {
  return h(React.Fragment, null,
    h('div', { className: 'rt-tag', style: { color: 'var(--cream-muted)' } }, "Mira's turn. What do you do?"),
    h(T.ChoiceCard, { stat: 'CHA', dc: 12, heroClass: 'bard' }, 'Sweet-talk the judges with a song about pie'),
    h(T.ChoiceCard, { stat: 'DEX', dc: 14, heroClass: 'bard' }, 'Swap the labels on the sugar and salt'),
    h(T.ChoiceCard, { stat: 'STR', dc: 10, heroClass: 'bard' }, 'Knead the dough really, really hard'));
};
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
