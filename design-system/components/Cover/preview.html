<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Lucky Goose</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--oak-900); color:var(--cream); font-family:var(--font-ui); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .candle { fill:var(--candle-500); }
  .parch { fill:var(--parchment-100); }
  .wax { fill:var(--wax-600); }
  .oak { fill:var(--oak-700); }
  .cut { fill:var(--oak-900); font-family:var(--font-display); font-size:210px; }
  .slab { rx:var(--radius-lg); }
  .card { rx:var(--radius-md); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:400; font-size:88px; line-height:.95; color:var(--cream); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; font-weight:600; color:var(--cream-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      candle-500 208x264 slab bled off the top (the main button gold, largest) · parchment-100 224x144 (the story card) · oak-700 bleeding off the right edge · wax-600 96x48 once (danger only, kept small)
  arrangement one tall candle slab with satellites, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     one oversized glyph: a "20" in the display face (Pirata One) cut out of the candle slab in oak-900, clipped by it; chosen because the Natural 20 is the brand's big moment
  scales      sides in space-2 multiples; gutters space-4; slab corners radius-lg, card corners radius-md
-->
<defs><clipPath id="slab"><rect x="16" y="-20" width="208" height="276" rx="20"/></clipPath></defs>
<rect class="candle slab" x="16" y="-20" width="208" height="276" rx="20"/>
<text class="cut" x="120" y="264" text-anchor="middle" clip-path="url(#slab)">20</text>
<rect class="parch card" x="240" y="40" width="224" height="144" rx="12"/>
<rect class="wax card" x="240" y="200" width="96" height="56" rx="12"/>
<rect class="oak card" x="352" y="200" width="160" height="56" rx="12"/>
</svg>
</div>
<div class="words">
<h1 class="name">The Lucky<br>Goose</h1>
<p class="tag">Pull up a chair. Roll for it.</p>
</div>
</div>
</body>
</html>
